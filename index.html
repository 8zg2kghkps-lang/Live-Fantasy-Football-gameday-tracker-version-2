<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gameday Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>html, body { margin:0; padding:0; background:#14181B; }</style>
</head>
<body>
<div id="ft-root"></div>
<style>
  #ft-root {
    --bg: #14181B;
    --panel: #1D2226;
    --panel-2: #23292E;
    --line: #2C3339;
    --turf: #3E7A52;
    --turf-bright: #57A96F;
    --amber: #E3A23C;
    --text: #ECEAE3;
    --text-dim: #9AA3A8;
    --danger: #C4593F;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    padding: 0;
    max-width: 780px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  #ft-root * { box-sizing: border-box; }
  #ft-root .scoreboard { background: linear-gradient(180deg, #1A2E22 0%, #14181B 100%); border-bottom: 1px solid var(--line); padding: 18px 20px 14px; }
  #ft-root .sb-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px; }
  #ft-root .sb-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; letter-spacing: 0.02em; font-weight: 600; }
  #ft-root .week-picker { display:flex; align-items:center; gap:8px; font-family:'Barlow Condensed', sans-serif; font-size: 15px; color: var(--text-dim); }
  #ft-root select.week-select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-family: inherit; font-size: 14px; }
  #ft-root .sb-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #ft-root .sb-card { background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; transition: box-shadow 0.3s; }
  #ft-root .sb-card.bump { animation: card-bump 0.5s ease; }
  #ft-root .sb-card .league-name { font-family:'Barlow Condensed', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 2px; }
  #ft-root .sb-card .league-total { font-family:'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 600; line-height: 1; color: var(--turf-bright); }
  #ft-root .sb-card .league-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  #ft-root .banner { font-size: 12.5px; color: var(--text-dim); background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 9px 20px; line-height: 1.5; }
  #ft-root .banner b { color: var(--amber); font-weight: 600; }
  #ft-root .auto-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; }
  #ft-root .auto-toggle { display:flex; align-items:center; gap:6px; color: var(--text); cursor:pointer; font-weight:600; }
  #ft-root .auto-toggle input { accent-color: var(--turf-bright); width:15px; height:15px; }
  #ft-root .auto-status { color: var(--text-dim); }
  #ft-root .tabs { display:flex; border-bottom: 1px solid var(--line); background: var(--panel); }
  #ft-root .tab { flex:1; text-align:center; padding: 11px 0; cursor:pointer; font-family:'Barlow Condensed', sans-serif; font-size: 16px; letter-spacing: 0.03em; color: var(--text-dim); border-bottom: 2px solid transparent; user-select:none; }
  #ft-root .tab.active { color: var(--text); border-bottom-color: var(--turf-bright); }
  #ft-root .league-body { padding: 16px 18px 22px; }
  #ft-root .section-label { font-family:'Barlow Condensed', sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 18px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  #ft-root .section-label:first-child { margin-top: 0; }
  #ft-root .row-block { border-bottom: 1px solid var(--line); border-radius: 8px; transition: background 0.25s, box-shadow 0.25s; }
  #ft-root .row-block.flash { background: rgba(87,169,111,0.14); box-shadow: 0 0 0 1px var(--turf-bright) inset; animation: row-flash 1.3s ease; }
  #ft-root .row { display:grid; grid-template-columns: 46px 20px 1fr 68px 42px 22px 52px 18px; gap: 4px; align-items:center; padding: 7px 2px; }
  #ft-root .row.bench-row { grid-template-columns: 20px 1fr 68px 42px 22px 52px 18px; }
  #ft-root .slot-badge { font-family:'Barlow Condensed', sans-serif; font-size: 11.5px; text-align:center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 1px; color: var(--text-dim); }
  #ft-root input.name-input { background: transparent; border: none; color: var(--text); font-size: 13.5px; width: 100%; padding: 4px 2px; font-family: inherit; }
  #ft-root input.name-input::placeholder { color: #55606a; }
  #ft-root input.name-input:focus { outline: none; background: var(--panel-2); border-radius: 5px; }
  #ft-root .pts-wrap { display:flex; flex-direction:column; align-items:stretch; gap: 2px; }
  #ft-root .last-play { font-size: 10px; text-align:right; color: var(--amber); font-weight: 600; min-height: 12px; padding-right: 2px; letter-spacing: 0.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ft-root .last-play.empty { color: transparent; }
  #ft-root .last-play.pop { animation: pop-text 0.5s ease; }
  #ft-root input.pts-input { background: var(--panel-2); border: 1px solid var(--line); color: var(--turf-bright); font-family:'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; text-align:right; border-radius: 6px; padding: 5px 5px; width: 100%; }
  #ft-root input.pts-input:focus { outline: 1px solid var(--turf-bright); }
  #ft-root button.auto-badge { font-family:'Barlow Condensed', sans-serif; font-size: 9.5px; font-weight:700; letter-spacing:0.02em; border-radius: 5px; padding: 4px 2px; cursor:pointer; border: 1px solid var(--line); background: var(--panel-2); line-height:1.1; }
  #ft-root button.auto-badge.on { color: var(--turf-bright); border-color: var(--turf-bright); }
  #ft-root button.auto-badge.paused { color: var(--text-dim); }
  #ft-root select.move-select { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--line); border-radius: 6px; font-size: 10.5px; padding: 4px 1px; width: 100%; font-family: inherit; }
  #ft-root button.del-btn { background: none; border: none; color: #55606a; cursor:pointer; font-size: 16px; line-height: 1; padding: 2px; }
  #ft-root button.del-btn:hover { color: var(--danger); }
  #ft-root button.log-btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--amber); cursor:pointer; font-size: 13px; border-radius: 6px; padding: 5px 2px; line-height:1; }
  #ft-root button.log-btn:hover { border-color: var(--amber); }
  #ft-root .log-panel { display:flex; flex-wrap:wrap; gap: 6px; align-items:center; padding: 8px; margin: 0 2px 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  #ft-root .log-panel input[type="text"] { flex: 1 1 150px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  #ft-root .log-panel input[type="number"] { width: 78px; background: var(--bg); border: 1px solid var(--line); color: var(--turf-bright); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  #ft-root .log-panel select.log-pos { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 6px; font-size: 12px; font-family: inherit; }
  #ft-root .td-check { display:flex; align-items:center; gap:4px; font-size: 12px; color: var(--text-dim); white-space:nowrap; }
  #ft-root .log-submit-btn, #ft-root .log-cancel-btn { border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor:pointer; font-family: inherit; border: 1px solid var(--line); }
  #ft-root .log-submit-btn { background: var(--turf); color: #fff; border-color: var(--turf); }
  #ft-root .log-cancel-btn { background: transparent; color: var(--text-dim); }
  #ft-root button.add-btn { background: none; border: 1px dashed var(--line); color: var(--text-dim); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor:pointer; font-family: inherit; }
  #ft-root button.add-btn:hover { border-color: var(--turf-bright); color: var(--turf-bright); }
  #ft-root .footer-row { display:flex; justify-content:space-between; align-items:center; margin-top: 18px; }
  #ft-root button.week-btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor:pointer; font-family: inherit; }
  #ft-root button.week-btn:hover { color: var(--text); border-color: var(--turf-bright); }
  #ft-root .save-note { font-size: 11px; color: #55606a; }
  #ft-root .empty-hint { font-size: 12px; color: #55606a; padding: 6px 0; }

  #ft-root .td-overlay { position:absolute; inset:0; z-index:999; display:none; align-items:center; justify-content:center; overflow:hidden; background: rgba(10,14,16,0.35); }
  #ft-root .td-overlay.show { display:flex; }
  #ft-root .confetti-piece { position:absolute; top:-14px; border-radius: 2px; opacity: 0.95; will-change: transform, opacity; }
  #ft-root .td-popup { background: linear-gradient(160deg,#1E3A29,#12161A); border:2px solid var(--turf-bright); border-radius:16px; padding:20px 32px; text-align:center; box-shadow:0 0 44px rgba(87,169,111,0.55); animation: td-pop-in 0.5s cubic-bezier(.34,1.56,.64,1); }
  #ft-root .td-emoji { font-size: 38px; line-height:1; }
  #ft-root .td-headline { font-family:'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: var(--amber); letter-spacing: 0.06em; margin-top: 4px; }
  #ft-root .td-player { font-size: 16px; margin-top: 6px; color: var(--text); }
  #ft-root .td-points { font-family:'Barlow Condensed', sans-serif; font-size: 20px; color: var(--turf-bright); margin-top: 2px; font-weight:600; }

  @keyframes td-pop-in { 0% { transform: scale(0.5) translateY(16px); opacity:0; } 60% { transform: scale(1.07); opacity:1; } 100% { transform: scale(1); } }
  @keyframes confetti-fall { 0% { transform: translateY(-10px) rotate(0deg); opacity:1; } 100% { transform: translateY(340px) rotate(680deg); opacity:0; } }
  @keyframes row-flash { 0% { background: rgba(87,169,111,0.35); } 100% { background: transparent; } }
  @keyframes pop-text { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  #ft-root .live-dot { width:7px; height:7px; border-radius:50%; background:#55606a; display:inline-block; margin-right:6px; vertical-align:middle; }
  #ft-root .live-dot.active { background: var(--turf-bright); animation: pulse-dot 1.4s ease-in-out infinite; }
  #ft-root .crown { margin-right:3px; filter: drop-shadow(0 0 3px rgba(227,162,60,0.7)); animation: crown-bob 1.8s ease-in-out infinite; display:inline-block; }
  #ft-root .temp-badge { margin-left:3px; font-size:12px; }
  #ft-root .status-icon { margin-right:3px; font-size:10px; }
  #ft-root .league-sub2 { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  #ft-root .row-block.flash-up { background: rgba(87,169,111,0.18); box-shadow: 0 0 0 1px var(--turf-bright) inset; animation: row-flash-up 1.3s ease; }
  #ft-root .row-block.flash-down { background: rgba(196,89,63,0.18); box-shadow: 0 0 0 1px var(--danger) inset; animation: row-flash-down 1.3s ease; }
  #ft-root .proj-line { font-size: 9px; color: var(--text-dim); text-align:right; padding-right:2px; }
  #ft-root .mvp-section { margin-bottom: 20px; }
  #ft-root .mvp-cols { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #ft-root .mvp-col { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  #ft-root .mvp-col-label { font-family:'Barlow Condensed', sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 6px; }
  #ft-root .mvp-row { display:flex; align-items:center; gap:6px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  #ft-root .mvp-row:last-child { border-bottom: none; }
  #ft-root .mvp-rank { font-size: 15px; width: 18px; flex-shrink:0; }
  #ft-root .mvp-name { flex:1; font-size: 13px; color: var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ft-root .mvp-total { font-family:'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; font-weight:600; color: var(--turf-bright); }
  #ft-root button.injury-badge { width: 18px; height: 20px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--text-dim); font-size: 8.5px; font-weight: 700; font-family: 'Barlow Condensed', sans-serif; cursor: pointer; padding: 0; line-height:1; }
  #ft-root button.injury-badge.inj-Q { background: var(--amber); color: #14181B; border-color: var(--amber); }
  #ft-root button.injury-badge.inj-O { background: #E36B3C; color: #14181B; border-color: #E36B3C; }
  #ft-root button.injury-badge.inj-IR { background: #8A2F2F; color: #fff; border-color: #8A2F2F; }
  #ft-root .recap-overlay { position:absolute; inset:0; z-index:998; display:none; align-items:center; justify-content:center; background: rgba(10,14,16,0.55); padding: 20px; }
  #ft-root .recap-overlay.show { display:flex; }
  #ft-root .recap-card { background: linear-gradient(160deg,#1E3A29,#14181B); border: 2px solid var(--turf-bright); border-radius: 16px; padding: 22px 24px; width: 100%; max-width: 340px; box-shadow: 0 0 40px rgba(87,169,111,0.4); }
  #ft-root .recap-title { font-family:'Barlow Condensed', sans-serif; font-size: 20px; font-weight:700; letter-spacing:0.03em; margin-bottom: 4px; }
  #ft-root .recap-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  #ft-root .recap-total { font-family:'Barlow Condensed', sans-serif; font-size: 44px; font-weight:700; color: var(--turf-bright); line-height:1; margin-bottom: 14px; }
  #ft-root .recap-row { display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; }
  #ft-root .recap-row:last-of-type { border-bottom: none; }
  #ft-root .recap-label { color: var(--text-dim); }
  #ft-root .recap-value { font-weight: 600; }
  #ft-root .recap-close-btn { margin-top: 16px; width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px; font-size: 13px; cursor:pointer; font-family: inherit; }

  @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(87,169,111,0.55); } 50% { box-shadow: 0 0 0 5px rgba(87,169,111,0); } }
  @keyframes crown-bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-2px) rotate(4deg); } }
  @keyframes row-flash-up { 0% { background: rgba(87,169,111,0.4); } 100% { background: transparent; } }
  @keyframes row-flash-down { 0% { background: rgba(196,89,63,0.4); } 100% { background: transparent; } }
</style>
<script>
(function(){

  window.storage = {
    async get(key){
      const raw = localStorage.getItem(key);
      return raw === null ? null : { key, value: raw };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value };
    }
  };

  const SKILL_SLOTS = ['QB','RB','WR','TE','FLEX','W/R/T','Q/W/R/T'];
  const AUTO_SLOTS = SKILL_SLOTS.concat(['D/ST','K']);
  function inferPosFromSlot(slot){
    if (slot === 'D/ST') return 'DST';
    if (['QB','RB','WR','TE','K'].includes(slot)) return slot;
    return null; // FLEX / W-R-T / Q-W-R-T are ambiguous — needs manual tag
  }

  function seedData(){
    return {
      espn: {
        label: 'ESPN · Half-PPR',
        starters: [
          {slot:'QB', name:'J. Dart', points:'', lastPlay:'', pos:'QB'},
          {slot:'RB', name:'J. Cook III', points:'', lastPlay:'', pos:'RB'},
          {slot:'RB', name:'J. Taylor', points:'', lastPlay:'', pos:'RB'},
          {slot:'WR', name:'T. Higgins', points:'', lastPlay:'', pos:'WR'},
          {slot:'WR', name:'T. McMillan', points:'', lastPlay:'', pos:'WR'},
          {slot:'TE', name:'T. McBride', points:'', lastPlay:'', pos:'TE'},
          {slot:'FLEX', name:'Q. Judkins', points:'', lastPlay:''},
          {slot:'D/ST', name:'Jaguars D/ST', points:'', lastPlay:'', pos:'DST'},
          {slot:'K', name:'C. Little', points:'', lastPlay:'', pos:'K'},
        ],
        bench: [
          {name:'J. Coker', points:'', lastPlay:''},
          {name:'C. Godwin Jr.', points:'', lastPlay:''},
          {name:'M. Lloyd', points:'', lastPlay:''},
          {name:'B. Thomas Jr.', points:'', lastPlay:''},
          {name:'B. Tuten', points:'', lastPlay:''},
          {name:'C. Watson', points:'', lastPlay:''},
          {name:'Texans D/ST', points:'', lastPlay:''},
        ]
      },
      yahoo: {
        label: 'Yahoo · Standard',
        starters: [
          {slot:'W/R/T', name:'J. Chase', points:'', lastPlay:''},
          {slot:'W/R/T', name:'T. McMillan', points:'', lastPlay:''},
          {slot:'W/R/T', name:'T. Pollard', points:'', lastPlay:''},
          {slot:'Q/W/R/T', name:'M. Willis', points:'', lastPlay:''},
        ],
        bench: [
          {name:'E. Egbuka', points:'', lastPlay:''},
          {name:'T. Henderson', points:'', lastPlay:''},
          {name:'C. Ward', points:'', lastPlay:''},
          {name:'T. Tucker', points:'', lastPlay:''},
        ]
      }
    };
  }

  const root = document.getElementById('ft-root');
  root.addEventListener('click', function unlockAudioOnce(){
    ensureAudioCtx();
    root.removeEventListener('click', unlockAudioOnce);
  }, { once: true });
  let state = { week: 1, activeTab: 'espn', data: {}, openLog: null, autoOn: false, autoStatus: 'Off', autoError: null, mvpData: null, mvpLoading: false, recapOpen: null, soundOn: true };
  let saveTimer = null;
  let autoIntervalId = null;

  function weekKey(w){ return 'roster:week:' + w; }

  function migrateYahoo(data){
    if (!data || !data.yahoo || !Array.isArray(data.yahoo.starters)) return data;
    const desiredSlots = ['W/R/T','W/R/T','W/R/T','Q/W/R/T'];
    const alreadyCorrect = data.yahoo.starters.length === 4 && data.yahoo.starters.every((s,i)=>s.slot===desiredSlots[i]);
    if (alreadyCorrect) return data;
    const kept = [];
    const overflowNames = [];
    data.yahoo.starters.forEach(s => {
      if (s.slot === 'W/R/T' || s.slot === 'Q/W/R/T') kept.push(s);
      else if (s.name && s.name.trim()) overflowNames.push({name: s.name, points: s.points || '', lastPlay: s.lastPlay || ''});
    });
    const newStarters = desiredSlots.map(slot => {
      const idx = kept.findIndex(k => k.slot === slot);
      if (idx >= 0) return kept.splice(idx, 1)[0];
      return {slot, name:'', points:'', lastPlay:''};
    });
    const leftoverBench = kept.map(k => ({name:k.name, points:k.points||'', lastPlay:k.lastPlay||''})).concat(overflowNames);
    data.yahoo.starters = newStarters;
    data.yahoo.bench = (data.yahoo.bench || []).concat(leftoverBench.filter(b => b.name && b.name.trim()));
    return data;
  }

  async function loadWeek(w){
    try {
      const res = await window.storage.get(weekKey(w), false);
      state.data = res ? migrateYahoo(JSON.parse(res.value)) : seedData();
    } catch(e){
      state.data = seedData();
    }
    state.openLog = null;
    render();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    const noteEl = root.querySelector('.save-note');
    if (noteEl) noteEl.textContent = 'Saving…';
    const weekAtCall = state.week;
    const snapshotAtCall = JSON.stringify(state.data);
    saveTimer = setTimeout(async () => {
      try {
        await window.storage.set(weekKey(weekAtCall), snapshotAtCall, false);
        const n = root.querySelector('.save-note');
        if (n) n.textContent = 'Saved';
      } catch(e){
        const n = root.querySelector('.save-note');
        if (n) n.textContent = 'Save failed';
      }
    }, 400);
  }

  function total(league){
    return state.data[league].starters.reduce((sum, p) => {
      const v = parseFloat(p.points);
      return sum + (isNaN(v) ? 0 : v);
    }, 0);
  }
  function startersFilled(league){
    return state.data[league].starters.filter(p => p.name.trim()).length;
  }
  function notStartedCount(league){
    const filled = state.data[league].starters.filter(p => p.name && p.name.trim());
    const notStarted = filled.filter(p => p.gameState !== 'post' && p.gameState !== 'in').length;
    return { notStarted, filled: filled.length };
  }

  function render(){
    const d = state.data;
    root.innerHTML = `
      <div class="scoreboard">
        <div class="sb-top">
          <div class="sb-title">Gameday Tracker</div>
          <div class="week-picker">Week
            <select class="week-select">
              ${Array.from({length:18},(_,i)=>i+1).map(w=>`<option value="${w}" ${w===state.week?'selected':''}>${w}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="sb-grid">
          <div class="sb-card" data-card="espn">
            <div class="league-name"><span class="live-dot ${state.autoOn?'active':''}"></span>${d.espn.label}</div>
            <div class="league-total" data-value="${total('espn')}">${total('espn').toFixed(2)}</div>
            <div class="league-sub">${startersFilled('espn')}/${d.espn.starters.length} starters set</div>

  function topScorerIdx(league){
    const starters = state.data[league].starters;
    let bestIdx = -1, bestVal = -Infinity;
    starters.forEach((p, i) => {
      const v = parseFloat(p.points);
      if (!isNaN(v) && p.name && p.name.trim() && v > bestVal){ bestVal = v; bestIdx = i; }
    });
    return bestVal > 0 ? bestIdx : -1;
  }

  async function computeSeasonStats(){
    const totals = { espn: {}, yahoo: {} };
    const trend = { espn: [], yahoo: [] };
    for (let w = 1; w <= 18; w++){
      try {
        const res = await window.storage.get(weekKey(w), false);
        if (!res) continue;
        const wd = JSON.parse(res.value);
        ['espn','yahoo'].forEach(league => {
          if (!wd[league]) return;
          const starterTotal = (wd[league].starters||[]).reduce((sum,p) => {
            const v = parseFloat(p.points);
            return sum + (isNaN(v) ? 0 : v);
          }, 0);
          const anyFilled = (wd[league].starters||[]).some(p => p.name && p.name.trim() && p.points !== '');
          if (anyFilled) trend[league].push({ week: w, total: Math.round(starterTotal * 100) / 100 });

          const all = [...(wd[league].starters||[]), ...(wd[league].bench||[])];
          all.forEach(p => {
            const name = (p.name||'').trim();
            if (!name) return;
            const v = parseFloat(p.points);
            if (isNaN(v)) return;
            if (!totals[league][name]) totals[league][name] = { total: 0, weeks: 0 };
            totals[league][name].total += v;
            totals[league][name].weeks += 1;
          });
        });
      } catch(e) { /* skip unreadable/missing week */ }
    }
    const rank = (obj, dir) => Object.entries(obj)
      .map(([name, d]) => ({ name, total: Math.round(d.total * 100) / 100, weeks: d.weeks }))
      .sort((a, b) => dir === 'desc' ? b.total - a.total : a.total - b.total)
      .slice(0, 3);
    state.mvpData = {
      espn: { top: rank(totals.espn, 'desc'), bottom: rank(totals.espn, 'asc') },
      yahoo: { top: rank(totals.yahoo, 'desc'), bottom: rank(totals.yahoo, 'asc') },
      trend
    };
    state.mvpLoading = false;
  }

  function renderTrendChart(trend){
    const espnPts = (trend && trend.espn) || [];
    const yahooPts = (trend && trend.yahoo) || [];
    if (espnPts.length < 2 && yahooPts.length < 2){
      return `<div class="empty-hint">Log at least two weeks to see the trend line.</div>`;
    }
    const W = 300, H = 120, padL = 28, padR = 10, padT = 10, padB = 18;
    const allWeeks = [...espnPts, ...yahooPts].map(p => p.week);
    const allVals = [...espnPts, ...yahooPts].map(p => p.total);
    const minW = Math.min(...allWeeks), maxW = Math.max(...allWeeks);
    let minV = Math.min(0, ...allVals), maxV = Math.max(...allVals);
    if (maxV === minV) maxV = minV + 1;
    const x = (w) => padL + (maxW === minW ? 0 : (w - minW) / (maxW - minW)) * (W - padL - padR);
    const y = (v) => (H - padB) - ((v - minV) / (maxV - minV)) * (H - padT - padB);
    const pathFor = (arr) => arr.length ? arr.map((p,i)=> (i===0?'M':'L') + x(p.week).toFixed(1) + ',' + y(p.total).toFixed(1)).join(' ') : '';
    const dotsFor = (arr, color) => arr.map(p => `<circle cx="${x(p.week).toFixed(1)}" cy="${y(p.total).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
    const weekTicks = [];
    for (let w = minW; w <= maxW; w++) weekTicks.push(w);
    const tickEvery = weekTicks.length > 9 ? Math.ceil(weekTicks.length / 9) : 1;
    const axisLabels = weekTicks.filter((w,i)=> i % tickEvery === 0)
      .map(w => `<text x="${x(w).toFixed(1)}" y="${H-4}" font-size="7" fill="#9AA3A8" text-anchor="middle">${w}</text>`).join('');
    return `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
        <line x1="${padL}" y1="${(H-padB).toFixed(1)}" x2="${W-padR}" y2="${(H-padB).toFixed(1)}" stroke="#2C3339" stroke-width="1"/>
        ${axisLabels}
        ${espnPts.length ? `<path d="${pathFor(espnPts)}" fill="none" stroke="#57A96F" stroke-width="2"/>` : ''}
        ${espnPts.length ? dotsFor(espnPts, '#57A96F') : ''}
        ${yahooPts.length ? `<path d="${pathFor(yahooPts)}" fill="none" stroke="#E3A23C" stroke-width="2"/>` : ''}
        ${yahooPts.length ? dotsFor(yahooPts, '#E3A23C') : ''}
      </svg>
      <div style="display:flex; gap:14px; margin-top:6px; font-size:11px; color:var(--text-dim);">
        <span><span style="display:inline-block;width:9px;height:9px;background:#57A96F;border-radius:2px;margin-right:4px;"></span>ESPN</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:#E3A23C;border-radius:2px;margin-right:4px;"></span>Yahoo</span>
      </div>
    `;
  }

  function slotEligibility(slot){
    if (slot === 'QB') return ['QB'];
    if (slot === 'RB') return ['RB'];
    if (slot === 'WR') return ['WR'];
    if (slot === 'TE') return ['TE'];
    if (slot === 'FLEX') return ['RB','WR','TE'];
    if (slot === 'D/ST') return ['DST'];
    if (slot === 'K') return ['K'];
    if (slot === 'W/R/T') return ['RB','WR','TE'];
    if (slot === 'Q/W/R/T') return ['QB','RB','WR','TE'];
    return [];
  }

  function computeOptimalLineup(league){
    const d = state.data[league];
    const slots = d.starters.map((s,i) => ({ idx:i, slot:s.slot, eligible: slotEligibility(s.slot) }));
    const sortedSlots = [...slots].sort((a,b) => a.eligible.length - b.eligible.length);

    const pool = [];
    let unranked = 0;
    d.starters.forEach((p) => {
      if (!p.name || !p.name.trim()) return;
      if (!p.pos){ unranked++; return; }
      const v = parseFloat(p.points);
      pool.push({ name: p.name, pos: p.pos, points: isNaN(v) ? 0 : v });
    });
    d.bench.forEach((p) => {
      if (!p.name || !p.name.trim()) return;
      if (!p.pos){ unranked++; return; }
      const v = parseFloat(p.points);
      pool.push({ name: p.name, pos: p.pos, points: isNaN(v) ? 0 : v });
    });

    const remaining = [...pool].sort((a,b) => b.points - a.points);
    const usedNames = new Set();
    const assignment = {};
    sortedSlots.forEach(slotInfo => {
      const pick = remaining.find(p => !usedNames.has(p.name) && slotInfo.eligible.includes(p.pos));
      if (pick){ assignment[slotInfo.idx] = pick; usedNames.add(pick.name); }
    });

    const optimalTotal = Object.values(assignment).reduce((s,p) => s + p.points, 0);
    const actualTotal = total(league);

    const swaps = [];
    d.starters.forEach((p, i) => {
      const pick = assignment[i];
      if (pick && pick.name !== p.name){
        swaps.push({ slot: p.slot, out: p.name || '(empty)', outPts: parseFloat(p.points) || 0, in: pick.name, inPts: pick.points });
      }
    });

    return {
      optimalTotal: Math.round(optimalTotal * 100) / 100,
      actualTotal: Math.round(actualTotal * 100) / 100,
      swaps,
      unranked
    };
  }

  function renderOptimalCard(league){
    const label = league === 'espn' ? 'ESPN · Half-PPR' : 'Yahoo · Standard';
    const r = computeOptimalLineup(league);
    const diff = Math.round((r.optimalTotal - r.actualTotal) * 100) / 100;
    return `
      <div class="recap-card">
        <div class="recap-title">🧮 Optimal Lineup</div>
        <div class="recap-sub">${label} · Week ${state.week}</div>
        <div class="recap-total">${r.actualTotal.toFixed(2)} <span style="font-size:14px; color:var(--text-dim); font-weight:400;">actual</span></div>
        <div class="recap-row"><span class="recap-label">Best possible</span><span class="recap-value">${r.optimalTotal.toFixed(2)} pts</span></div>
        <div class="recap-row"><span class="recap-label">${diff > 0 ? 'Points left on bench' : 'You nailed it'}</span><span class="recap-value" style="color:${diff>0?'var(--danger)':'var(--turf-bright)'}">${diff > 0 ? '+' + diff.toFixed(2) : '0.00'}</span></div>
        ${r.swaps.length ? r.swaps.map(s => `
          <div class="recap-row"><span class="recap-label">${s.slot}</span><span class="recap-value">${escapeAttr(s.out)} (${s.outPts.toFixed(1)}) → ${escapeAttr(s.in)} (${s.inPts.toFixed(1)})</span></div>
        `).join('') : `<div class="recap-row"><span class="recap-label">Lineup</span><span class="recap-value">Already optimal 🎉</span></div>`}
        ${r.unranked > 0 ? `<div class="empty-hint" style="margin-top:8px;">${r.unranked} player(s) don't have a position tagged yet, so they can't be checked. Tap ⚡ on them and set Pos.</div>` : ''}
        <button class="recap-close-btn" data-action="recap-close">Close</button>
      </div>
    `;
  }

  function renderRecapCard(league){
    const d = state.data[league];
    if (!d) return '';
    const filled = d.starters.filter(p => p.name && p.name.trim() && p.points !== '' && !isNaN(parseFloat(p.points)));
    const teamTotal = total(league);
    let top = null, bust = null;
    filled.forEach(p => {
      const v = parseFloat(p.points);
      if (!top || v > parseFloat(top.points)) top = p;
      if (!bust || v < parseFloat(bust.points)) bust = p;
    });
    const label = league === 'espn' ? 'ESPN · Half-PPR' : 'Yahoo · Standard';
    return `
      <div class="recap-card">
        <div class="recap-title">🏈 Week ${state.week} Recap</div>
        <div class="recap-sub">${label}</div>
        <div class="recap-total">${teamTotal.toFixed(2)} <span style="font-size:14px; color:var(--text-dim); font-weight:400;">pts</span></div>
        <div class="recap-row"><span class="recap-label">🥇 Top scorer</span><span class="recap-value">${top ? escapeAttr(top.name) + ' — ' + parseFloat(top.points).toFixed(2) : '—'}</span></div>
        <div class="recap-row"><span class="recap-label">🧊 Biggest bust</span><span class="recap-value">${bust ? escapeAttr(bust.name) + ' — ' + parseFloat(bust.points).toFixed(2) : '—'}</span></div>
        <div class="recap-row"><span class="recap-label">Starters set</span><span class="recap-value">${startersFilled(league)}/${d.starters.length}</span></div>
        <button class="recap-close-btn" data-action="recap-close">Close</button>
      </div>
    `;
  }

  function renderMVPTab(){
    if (state.mvpLoading){
      return `<div class="empty-hint">Crunching season totals across your saved weeks…</div>`;
    }
    const d = state.mvpData || { espn:{top:[],bottom:[]}, yahoo:{top:[],bottom:[]}, trend:{espn:[],yahoo:[]} };
    const medals = ['🥇','🥈','🥉'];
    const busts = ['📉','🪦','💀'];
    const renderCol = (label, arr, icons) => `
      <div class="mvp-col">
        <div class="mvp-col-label">${label}</div>
        ${arr.length ? arr.map((p,i)=>`
          <div class="mvp-row">
            <span class="mvp-rank">${icons[i]||''}</span>
            <span class="mvp-name">${escapeAttr(p.name)}</span>
            <span class="mvp-total">${p.total.toFixed(2)}</span>
          </div>
        `).join('') : `<div class="empty-hint">Not enough season data yet.</div>`}
      </div>`;
    return `
      <div class="mvp-section">
        <div class="section-label">📈 Season Trend — weekly team points</div>
        <div class="mvp-col">
          ${renderTrendChart(d.trend)}
        </div>
      </div>
      <div class="mvp-section">
        <div class="section-label">🏆 Fantasy MVP Race — top 3 by season points</div>
        <div class="mvp-cols">
          ${renderCol('ESPN', d.espn.top, medals)}
          ${renderCol('Yahoo', d.yahoo.top, medals)}
        </div>
      </div>
      <div class="mvp-section">
        <div class="section-label">🧊 Bust of the Year — bottom 3 by season points</div>
        <div class="mvp-cols">
          ${renderCol('ESPN', d.espn.bottom, busts)}
          ${renderCol('Yahoo', d.yahoo.bottom, busts)}

        </div>
      </div>
    `;
  }

  function renderLeague(league){
    const d = state.data[league];
    const topIdx = topScorerIdx(league);
    return `
      <div class="section-label">Starters</div>
      ${d.starters.map((p,i)=>renderRowBlock(league,'starter',i,p,d,i===topIdx)).join('')}
      <div class="section-label">Bench <button class="add-btn" data-action="add-bench">+ Add player</button></div>
      ${d.bench.length ? d.bench.map((p,i)=>renderRowBlock(league,'bench',i,p,d,false)).join('') : `<div class="empty-hint">No bench players added yet.</div>`}
    `;
  }

  function renderRowBlock(league, kind, i, p, d, isTop){
    const isOpen = state.openLog && state.openLog.league===league && state.openLog.kind===kind && state.openLog.idx===i;
    const isSkill = kind === 'starter' ? AUTO_SLOTS.includes(p.slot) : !!(p.name && p.name.trim());
    const autoBadge = isSkill ? `<button class="auto-badge ${p.autoEnabled===false?'paused':'on'}" data-action="toggle-auto" title="${p.autoEnabled===false?'Auto-sync paused — tap to resume':'Auto-syncing live stats — tap to pause'}">${p.autoEnabled===false?'⏸':'●'}${p.autoEnabled===false?'PAUSE':'AUTO'}</button>` : `<span></span>`;
    const crown = (kind === 'starter' && isTop) ? `<span class="crown" title="Top scorer">👑</span>` : '';
    const pts = parseFloat(p.points), proj = parseFloat(p.proj);
    let tempBadge = '';
    if (kind === 'starter' && !isNaN(pts) && !isNaN(proj) && proj > 0){
      if (pts >= proj * 1.15) tempBadge = `<span class="temp-badge" title="Blowing past projection">🔥</span>`;
      else if (pts <= proj * 0.85) tempBadge = `<span class="temp-badge" title="Well under projection">🥶</span>`;
    }
    const injuryBadge = `<button class="injury-badge inj-${p.injury||''}" data-action="cycle-injury" title="Tap to set injury status (None → Q → O → IR)">${p.injury||''}</button>`;
    let statusIcon = '';
    if (p.name && p.name.trim()){
      if (p.gameState === 'post') statusIcon = `<span class="status-icon" title="Game final">✅</span>`;
      else if (p.gameState === 'in') statusIcon = `<span class="status-icon" title="Game in progress">🟢</span>`;
      else statusIcon = `<span class="status-icon" title="Game not started yet (or bye)">⏳</span>`;
    }
    const rowInner = kind === 'starter' ? `
        <div class="slot-badge">${p.slot}</div>
        ${injuryBadge}
        <input class="name-input" placeholder="Add player…" value="${escapeAttr(p.name)}" data-field="name">
        <div class="pts-wrap">
          <div class="last-play ${p.lastPlay ? '' : 'empty'}">${statusIcon}${crown}${escapeAttr(p.lastPlay || '—')}${tempBadge}</div>
          <input class="pts-input" placeholder="0.0" inputmode="decimal" value="${escapeAttr(p.points)}" data-field="points">
        </div>
        ${autoBadge}
        <button class="log-btn" data-action="toggle-log" title="Log a play">⚡</button>
        <select class="move-select" data-field="move">
          <option value="">Move…</option>
          <option value="bench">→ Bench</option>
        </select>
        <button class="del-btn" data-action="clear" title="Clear">×</button>
      ` : `
        ${injuryBadge}
        <input class="name-input" placeholder="Player name…" value="${escapeAttr(p.name)}" data-field="name">
        <div class="pts-wrap">
          <div class="last-play ${p.lastPlay ? '' : 'empty'}">${statusIcon}${escapeAttr(p.lastPlay || '—')}</div>
          <input class="pts-input" placeholder="0.0" inputmode="decimal" value="${escapeAttr(p.points)}" data-field="points">
        </div>
        ${autoBadge}
        <button class="log-btn" data-action="toggle-log" title="Log a play">⚡</button>
        <select class="move-select" data-field="move">
          <option value="">Move…</option>
          ${d.starters.map((s,si)=>`<option value="${si}">→ ${s.slot}${s.name ? ' (swap)' : ''}</option>`).join('')}
        </select>
        <button class="del-btn" data-action="remove-bench" title="Remove">×</button>
      `;
    return `
      <div class="row-block" data-league="${league}" data-kind="${kind}" data-idx="${i}">
        <div class="row ${kind==='bench'?'bench-row':''}">${rowInner}</div>
        ${isOpen ? `
        <div class="log-panel">
          <input type="text" class="log-note" placeholder="Play note, e.g. 60 yd catch" value="">
          <input type="number" step="0.1" class="log-delta" placeholder="pts +/-" value="">
          ${kind === 'starter' ? `<input type="number" step="0.1" class="log-proj" placeholder="proj pts" value="${escapeAttr(p.proj || '')}" title="Set this player's projected points, used for the 🔥/🥶 badge">` : ``}
          <select class="log-pos" title="This player's actual position (used by the Optimal Lineup checker)">
            <option value="" ${!p.pos?'selected':''}>Pos…</option>
            <option value="QB" ${p.pos==='QB'?'selected':''}>QB</option>
            <option value="RB" ${p.pos==='RB'?'selected':''}>RB</option>
            <option value="WR" ${p.pos==='WR'?'selected':''}>WR</option>
            <option value="TE" ${p.pos==='TE'?'selected':''}>TE</option>
            <option value="K" ${p.pos==='K'?'selected':''}>K</option>
            <option value="DST" ${p.pos==='DST'?'selected':''}>D/ST</option>
          </select>
          <label class="td-check"><input type="checkbox" class="log-td"> 🏈 Touchdown</label>
          <button class="log-submit-btn" data-action="log-submit">Add</button>
          <button class="log-cancel-btn" data-action="log-cancel">Cancel</button>
        </div>` : ``}
      </div>
    `;
  }

  function escapeAttr(v){
    return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }
  function getList(league, kind){
    return kind === 'starter' ? state.data[league].starters : state.data[league].bench;
  }

  function attachHandlers(){
    root.querySelector('.week-select').addEventListener('change', (e) => {
      state.week = parseInt(e.target.value, 10);
      loadWeek(state.week);
    });

    root.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        state.activeTab = t.dataset.tab;
        state.openLog = null;
        if (state.activeTab === 'mvp' && !state.mvpData){
          state.mvpLoading = true;
          render();
          computeSeasonStats().then(render);
        } else {
          render();
        }
      });
    });

    const autoToggle = root.querySelector('#auto-toggle-input');
    if (autoToggle){
      autoToggle.addEventListener('change', () => {
        ensureAudioCtx();
        state.autoOn = autoToggle.checked;
        if (state.autoOn){ pollLiveStats(); startAutoInterval(); }
        else { stopAutoInterval(); state.autoStatus = 'Off'; state.autoError = null; updateAutoStatusDOM(); }
      });
    }

    const soundToggleBtn = root.querySelector('#sound-toggle-btn');
    if (soundToggleBtn){
      soundToggleBtn.addEventListener('click', () => {
        ensureAudioCtx();
        state.soundOn = !state.soundOn;
        render();
      });
    }

    root.querySelectorAll('.row-block').forEach(blockEl => {
      const league = blockEl.dataset.league, kind = blockEl.dataset.kind, idx = parseInt(blockEl.dataset.idx, 10);
      const list = getList(league, kind);

      blockEl.querySelectorAll('input[data-field]').forEach(inp => {
        inp.addEventListener('input', () => {
          const field = inp.dataset.field;
          if (field === 'name'){
            const oldName = list[idx].name;
            list[idx].name = inp.value;
            if (inp.value.trim() !== oldName.trim()){
              // New player in this slot — wipe old tracking so points start fresh for them.

  function animateNumber(el, from, to, duration){
    if (!el) return;
    if (Math.abs(to - from) < 0.005){ el.textContent = to.toFixed(2); el.dataset.value = to; return; }
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = from + (to - from) * eased;
      el.textContent = val.toFixed(2);
      if (t < 1) requestAnimationFrame(tick);
      else { el.textContent = to.toFixed(2); el.dataset.value = to; }
    }
    requestAnimationFrame(tick);
  }

  function bumpTotals(league, bump){
    const totalEl = root.querySelector('.sb-card[data-card="'+league+'"] .league-total');

    if (totalEl){
      const fromVal = parseFloat(totalEl.dataset.value || totalEl.textContent) || 0;
      animateNumber(totalEl, fromVal, newVal, 550);

    if (sub2El){
      const ns = notStartedCount(league);

  let audioCtx = null;
  function ensureAudioCtx(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { /* no audio support */ }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTDSound(){
    if (!state.soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // triumphant little arpeggio
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = now + i * 0.09;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
  }

  let tdTimer = null;
  function triggerTouchdown(name, delta){
    const overlay = root.querySelector('.td-overlay');
    if (!overlay) return;
    playTDSound();
    overlay.querySelector('.td-player').textContent = name;
    const d = Number(delta);
    overlay.querySelector('.td-points').textContent = (isNaN(d) || d === 0) ? 'Touchdown!' : ((d >= 0 ? '+' : '') + d.toFixed(1) + ' pts');
    const layer = overlay.querySelector('.confetti-layer');
    layer.innerHTML = '';
    const colors = ['#57A96F','#E3A23C','#ECEAE3','#E35D5D','#4C9EE3'];
    for (let i=0;i<44;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const w = 5 + Math.random()*5, h = 9 + Math.random()*7;
      piece.style.width = w+'px'; piece.style.height = h+'px';
      piece.style.left = (Math.random()*100)+'%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      const dur = 1.4 + Math.random()*1.2, delay = Math.random()*0.3;
      piece.style.animation = `confetti-fall ${dur}s ease-in ${delay}s forwards`;
      layer.appendChild(piece);
    }
    overlay.classList.add('show');
    clearTimeout(tdTimer);
    tdTimer = setTimeout(() => hideTouchdown(), 2800);
  }

  // ---------- Live auto-poll (real NFL box scores, public ESPN scoreboard/summary endpoints) ----------
  function normalizeName(n){
    return String(n||'').toLowerCase().replace(/[.']/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
  }
  function lastNameInitial(n){
    const parts = normalizeName(n).split(' ').filter(Boolean);
    if (!parts.length) return null;
    return { initial: parts[0][0], last: parts[parts.length-1] };
  }
  function namesMatch(rosterName, statName){
    const a = lastNameInitial(rosterName), b = lastNameInitial(statName);
    if (!a || !b) return false;
    return a.initial === b.initial && a.last === b.last;
  }
  function calcPoints(s, scoring){
    let pts = 0;
    pts += (s.passYds||0) * 0.04;
    pts += (s.passTD||0) * 4;
    pts += (s.int||0) * -2;
    pts += (s.rushYds||0) * 0.1;
    pts += (s.rushTD||0) * 6;
    pts += (s.recYds||0) * 0.1;
    pts += (s.recTD||0) * 6;
    pts += (s.rec||0) * (scoring === 'half-ppr' ? 0.5 : 0);
    pts += (s.fumLost||0) * -2;
    return Math.round(pts * 100) / 100;
  }

  // Exact ESPN league scoring (from league Scoring Settings)
  function calcDSTPoints(s){
    let pts = 0;
    const pa = s.pointsAllowed;
    if (pa !== undefined && pa !== null){
      if (pa === 0) pts += 5;
      else if (pa <= 6) pts += 4;
      else if (pa <= 13) pts += 3;
      else if (pa <= 17) pts += 1;
      else if (pa <= 21) pts += 0;
      else if (pa <= 27) pts += 0;
      else if (pa <= 34) pts += -1;
      else if (pa <= 45) pts += -3;
      else pts += -5;
    }
    const ya = s.yardsAllowed;
    if (ya !== undefined && ya !== null){
      if (ya < 100) pts += 5;
      else if (ya <= 199) pts += 3;
      else if (ya <= 299) pts += 2;
      else if (ya <= 349) pts += 0;
      else if (ya <= 399) pts += -1;
      else if (ya <= 449) pts += -3;
      else if (ya <= 499) pts += -5;
      else if (ya <= 549) pts += -6;
      else pts += -7;
    }
    pts += (s.sacks||0) * 1;
    pts += (s.int||0) * 2;
    pts += (s.fumRec||0) * 2;
    return Math.round(pts * 100) / 100;
  }
  function calcKPoints(s){
    let pts = 0;
    pts += (s.patMade||0) * 1;
    pts += (s.fgMiss||0) * -1;
    return Math.round(pts * 100) / 100;
  }
  function describeDeltaDST(oldS, newS){
    oldS = oldS || {};
    if ((newS.sacks||0) > (oldS.sacks||0)) return '+Sack';
    if ((newS.int||0) > (oldS.int||0)) return '+INT';
    if ((newS.fumRec||0) > (oldS.fumRec||0)) return '+Fumble Rec';
    if (newS.pointsAllowed !== undefined && oldS.pointsAllowed !== undefined && newS.pointsAllowed !== oldS.pointsAllowed) return 'Score update';
    return null;
  }
  function describeDeltaK(oldS, newS){
    oldS = oldS || {};
    if ((newS.patMade||0) > (oldS.patMade||0)) return '+PAT';
    if ((newS.fgMiss||0) > (oldS.fgMiss||0)) return 'Missed FG';
    return null;
  }
  function describeDelta(oldS, newS){
    oldS = oldS || {};
    const d = {
      rushYds: (newS.rushYds||0) - (oldS.rushYds||0),
      rushTD: (newS.rushTD||0) - (oldS.rushTD||0),
      recYds: (newS.recYds||0) - (oldS.recYds||0),
      recTD: (newS.recTD||0) - (oldS.recTD||0),
      passYds: (newS.passYds||0) - (oldS.passYds||0),
      passTD: (newS.passTD||0) - (oldS.passTD||0),
      int: (newS.int||0) - (oldS.int||0),
    };
    if (d.recTD > 0) return `+TD catch${d.recYds>0?' ('+d.recYds+'yd)':''}`;
    if (d.rushTD > 0) return `+TD run${d.rushYds>0?' ('+d.rushYds+'yd)':''}`;
    if (d.passTD > 0) return `+TD pass`;
    if (d.recYds > 0) return `+${Math.round(d.recYds)} yd catch`;
    if (d.rushYds > 0) return `+${Math.round(d.rushYds)} yd run`;
    if (d.passYds > 0) return `+${Math.round(d.passYds)} yd passing`;
    if (d.int > 0) return `INT thrown`;
    return null;
  }

  async function fetchLiveStatLines(){
    const sbRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
    if (!sbRes.ok) throw new Error('scoreboard fetch failed: ' + sbRes.status);
    const sb = await sbRes.json();
    const events = (sb.events || []).filter(e => {
      const st = e.status && e.status.type && e.status.type.state;
      return st === 'in' || st === 'post';
    });
    const allPlayers = [];
    const teamsMap = {};
    const pairs = [];

    for (const ev of events){
      try {
        const sumRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=' + ev.id);
        if (!sumRes.ok) continue;
        const sum = await sumRes.json();
        const evState = (ev.status && ev.status.type && ev.status.type.state) || 'in';

        // --- team score (points allowed) pairing ---
        const comp = sum.header && sum.header.competitions && sum.header.competitions[0];
        if (comp && comp.competitors && comp.competitors.length === 2){
          const ids = [];
          comp.competitors.forEach(c => {
            const tid = c.team && c.team.id;
            if (!tid) return;
            ids.push(tid);
            teamsMap[tid] = teamsMap[tid] || { abbr: c.team.abbreviation, nickname: (c.team.name || c.team.shortDisplayName || '').toLowerCase() };
            teamsMap[tid].scoreFor = parseFloat(c.score) || 0;
            teamsMap[tid].gameState = evState;
          });
          if (ids.length === 2){
            teamsMap[ids[0]].pointsAllowed = teamsMap[ids[1]].scoreFor;
            teamsMap[ids[1]].pointsAllowed = teamsMap[ids[0]].scoreFor;
            pairs.push(ids);
          }
        }

        // --- team-level box score stats (yards, sacks-allowed, turnovers) ---
        const teamStatsArr = (sum.boxscore && sum.boxscore.teams) || [];
        teamStatsArr.forEach(ts => {
          const tid = ts.team && ts.team.id;
          if (!tid) return;
          teamsMap[tid] = teamsMap[tid] || { abbr: ts.team.abbreviation, nickname: (ts.team.name || ts.team.shortDisplayName || '').toLowerCase() };
          const stats = ts.statistics || [];
          const find = (names) => {
            for (const n of names){
              const f = stats.find(s => (s.name||'').toLowerCase() === n.toLowerCase());
              if (f) return parseFloat(f.displayValue) || 0;
            }
            return null;
          };
          const totalYds = find(['totalYards']);
          const sacksAllowed = find(['sacksYardsLost','sacks']);
          const intThrown = find(['interceptions']);
          const fumLost = find(['fumblesLost']);
          if (totalYds != null) teamsMap[tid].ownYards = totalYds;
          if (sacksAllowed != null) teamsMap[tid].sacksAllowed = sacksAllowed;
          if (intThrown != null) teamsMap[tid].turnoverInt = intThrown;
          if (fumLost != null) teamsMap[tid].turnoverFum = fumLost;
        });

        // --- player-level stats (passing/rushing/receiving/fumbles/kicking) ---
        const teams = (sum.boxscore && sum.boxscore.players) || [];
        teams.forEach(team => {
          (team.statistics || []).forEach(cat => {
            const labels = cat.labels || [];
            const ydsIdx = labels.indexOf('YDS');
            const tdIdx = labels.indexOf('TD');
            const intIdx = labels.indexOf('INT');
            const recIdx = labels.indexOf('REC');
            const lostIdx = labels.indexOf('LOST');
            const fgIdx = labels.indexOf('FG');
            const xpIdx = labels.indexOf('XP');
            (cat.athletes || []).forEach(a => {
              const nm = a.athlete && a.athlete.displayName;
              if (!nm) return;
              const stats = a.stats || [];
              const num = (i) => (i >= 0 && stats[i] !== undefined) ? (parseFloat(stats[i]) || 0) : 0;
              let entry = allPlayers.find(p => p.name === nm);
              if (!entry){ entry = {name: nm, passYds:0,passTD:0,int:0,rushYds:0,rushTD:0,recYds:0,recTD:0,rec:0,fumLost:0,fgMake:0,fgAtt:0,fgMiss:0,patMade:0,patAtt:0}; allPlayers.push(entry); }
              entry.gameState = evState;
              if (cat.name === 'passing'){ entry.passYds += num(ydsIdx); entry.passTD += num(tdIdx); entry.int += num(intIdx); }
              else if (cat.name === 'rushing'){ entry.rushYds += num(ydsIdx); entry.rushTD += num(tdIdx); }
              else if (cat.name === 'receiving'){ entry.recYds += num(ydsIdx); entry.recTD += num(tdIdx); entry.rec += num(recIdx); }
              else if (cat.name === 'fumbles'){ entry.fumLost += num(lostIdx); }
              else if (cat.name === 'kicking'){
                const parseFrac = (s) => { if (!s) return {made:0,att:0}; const parts = String(s).split('/'); return { made: parseInt(parts[0],10)||0, att: parseInt(parts[1],10)||0 }; };
                const fg = parseFrac(fgIdx>=0 ? stats[fgIdx] : null);
                const xp = parseFrac(xpIdx>=0 ? stats[xpIdx] : null);
                entry.fgMake += fg.made; entry.fgAtt += fg.att; entry.fgMiss = entry.fgAtt - entry.fgMake;
                entry.patMade += xp.made; entry.patAtt += xp.att;
              }
            });
          });
        });
      } catch(err) { /* skip this game, keep going */ }
    }

    // cross-assign opponent-derived D/ST credit (yards/turnovers allowed by the OTHER team's offense)
    pairs.forEach(([a,b]) => {
      if (!teamsMap[a] || !teamsMap[b]) return;
      teamsMap[a].yardsAllowed = teamsMap[b].ownYards;
      teamsMap[b].yardsAllowed = teamsMap[a].ownYards;
      teamsMap[a].int = teamsMap[b].turnoverInt;
      teamsMap[b].int = teamsMap[a].turnoverInt;
      teamsMap[a].fumRec = teamsMap[b].turnoverFum;
      teamsMap[b].fumRec = teamsMap[a].turnoverFum;
      teamsMap[a].sacks = teamsMap[b].sacksAllowed;
      teamsMap[b].sacks = teamsMap[a].sacksAllowed;
    });

    return { players: allPlayers, teams: Object.values(teamsMap) };
  }

  function processAutoPlayer(p, league, allPlayers, allTeams){
    if (!p.name || !p.name.trim()) return null;
    if (p.autoEnabled === false) return null;
    const slotHint = p.slot || null; // starters have a slot; bench players don't, so we infer

    let newTotal, newStats, desc, isTDEvent = false, gameState = null, matched = false;

    const tryDST = () => {
      if (league !== 'espn') return false;
      const nickname = p.name.replace(/\s*D\/ST$/i,'').trim().toLowerCase();
      if (!nickname) return false;
      const match = allTeams.find(t => t.nickname && (t.nickname.includes(nickname) || nickname.includes(t.nickname)));
      if (!match) return false;
      newTotal = calcDSTPoints(match);
      desc = describeDeltaDST(p.autoStats || {}, match);
      newStats = { pointsAllowed: match.pointsAllowed, yardsAllowed: match.yardsAllowed, sacks: match.sacks, int: match.int, fumRec: match.fumRec };
      gameState = match.gameState;
      return true;
    };
    const tryK = (candidate) => {
      const match = candidate || allPlayers.find(sp => namesMatch(p.name, sp.name) && (sp.fgAtt > 0 || sp.patAtt > 0));
      if (!match) return false;
      newTotal = calcKPoints(match);
      desc = describeDeltaK(p.autoStats || {}, match);
      newStats = { patMade: match.patMade, fgMiss: match.fgMiss };
      gameState = match.gameState;
      return true;
    };
    const trySkill = () => {
      const match = allPlayers.find(sp => namesMatch(p.name, sp.name));
      if (!match) return false;
      newTotal = calcPoints(match, league === 'espn' ? 'half-ppr' : 'standard');
      const oldStats = p.autoStats || {};
      const oldTDs = (oldStats.rushTD||0) + (oldStats.recTD||0) + (oldStats.passTD||0);
      const newTDs = (match.rushTD||0) + (match.recTD||0) + (match.passTD||0);
      desc = describeDelta(oldStats, match);
      isTDEvent = newTDs > oldTDs;
      newStats = { passYds:match.passYds, passTD:match.passTD, int:match.int, rushYds:match.rushYds, rushTD:match.rushTD, recYds:match.recYds, recTD:match.recTD, rec:match.rec, fumLost:match.fumLost };
      gameState = match.gameState;
      return true;
    };

    if (slotHint === 'D/ST') matched = tryDST();
    else if (slotHint === 'K') matched = tryK();
    else if (slotHint && SKILL_SLOTS.includes(slotHint)) matched = trySkill();
    else if (!slotHint){
      // Bench: position isn't stored, so infer it.
      if (/D\/ST$/i.test(p.name.trim())) matched = tryDST();
      if (!matched && league === 'espn'){
        const kmatch = allPlayers.find(sp => namesMatch(p.name, sp.name) && (sp.fgAtt > 0 || sp.patAtt > 0) && (sp.passYds+sp.rushYds+sp.recYds+sp.passTD+sp.rushTD+sp.recTD === 0));
        if (kmatch) matched = tryK(kmatch);
      }
      if (!matched) matched = trySkill();
    }

    if (!matched) return null;
    if (gameState) p.gameState = gameState;

    const prevTotal = p.autoTotal || 0;
    if (!(desc || newTotal !== prevTotal)) return null;

    p.autoTotal = newTotal;
    p.points = newTotal.toFixed(2);
    if (desc) p.lastPlay = desc;
    p.autoStats = newStats;
    return { dir: newTotal >= prevTotal ? 'up' : 'down', isTDEvent, delta: newTotal - prevTotal, name: p.name };
  }

  async function pollLiveStats(){
    if (!state.autoOn) return;
    try {
      const { players: allPlayers, teams: allTeams } = await fetchLiveStatLines();
      const oldTotals = { espn: total('espn'), yahoo: total('yahoo') };
      const changed = []; // {league, kind, idx, dir, isTDEvent, delta, name}

      ['espn','yahoo'].forEach(league => {
        ['starters','bench'].forEach(kind => {
          state.data[league][kind].forEach((p, idx) => {
            const result = processAutoPlayer(p, league, allPlayers, allTeams);
            if (result) changed.push({ league, kind, idx, ...result });
          });
        });
      });

      if (changed.length){
        scheduleSave();
        render();
        changed.forEach(c => {
          const el = root.querySelector(`.row-block[data-league="${c.league}"][data-kind="${c.kind}"][data-idx="${c.idx}"]`);
          if (el){
            const cls = c.dir === 'down' ? 'flash-down' : 'flash-up';
            el.classList.add(cls);
            setTimeout(()=>el.classList.remove(cls), 1300);
          }
          if (c.isTDEvent) triggerTouchdown(c.name, c.delta);
        });
        ['espn','yahoo'].forEach(league => {
          const totalEl = root.querySelector('.sb-card[data-card="'+league+'"] .league-total');
          if (totalEl) animateNumber(totalEl, oldTotals[league], total(league), 550);
        });
      }

      state.autoStatus = 'Synced ' + new Date().toLocaleTimeString();
      state.autoError = null;
    } catch(err){
      state.autoError = 'Auto-sync unavailable here (blocked in this preview — works once hosted on your own domain).';
    }
    updateAutoStatusDOM();
  }

  function startAutoInterval(){
    stopAutoInterval();
    autoIntervalId = setInterval(pollLiveStats, 15000);
  }
  function stopAutoInterval(){
    if (autoIntervalId) clearInterval(autoIntervalId);
    autoIntervalId = null;
  }

  loadWeek(state.week);
})();
</script>
